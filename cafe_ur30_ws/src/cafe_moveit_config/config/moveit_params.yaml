# All static MoveIt 2 settings in ONE file (loaded by move_group and by pick_place_executor).
/**:
  ros__parameters:

    # ---- inverse kinematics ------------------------------------------------------------
    robot_description_kinematics:
      ur_manipulator:
        kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
        kinematics_solver_search_resolution: 0.005
        kinematics_solver_timeout: 0.05

    # ---- joint limits used for time parameterisation (SPEED LIMITS ARE HERE) ------------
    # UR30 hardware allows ~2.1 rad/s (big joints) and ~3.1 rad/s (wrists).
    robot_description_planning:
      joint_limits:
        shoulder_pan_joint:  {has_velocity_limits: true, max_velocity: 2.0, has_acceleration_limits: true, max_acceleration: 4.0}
        shoulder_lift_joint: {has_velocity_limits: true, max_velocity: 2.0, has_acceleration_limits: true, max_acceleration: 4.0}
        elbow_joint:         {has_velocity_limits: true, max_velocity: 2.0, has_acceleration_limits: true, max_acceleration: 4.0}
        wrist_1_joint:       {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 8.0}
        wrist_2_joint:       {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 8.0}
        wrist_3_joint:       {has_velocity_limits: true, max_velocity: 3.0, has_acceleration_limits: true, max_acceleration: 8.0}

    # ---- OMPL planning pipeline (only a fallback; normal moves are straight lines) -------
    move_group:
      planning_plugin: ompl_interface/OMPLPlanner
      request_adapters: >-
        default_planner_request_adapters/AddTimeOptimalParameterization
        default_planner_request_adapters/FixWorkspaceBounds
        default_planner_request_adapters/FixStartStateBounds
        default_planner_request_adapters/FixStartStateCollision
        default_planner_request_adapters/FixStartStatePathConstraints
      start_state_max_bounds_error: 0.1
      planner_configs:
        RRTConnectkConfigDefault:
          type: geometric::RRTConnect
          range: 0.0
        RRTstarkConfigDefault:
          type: geometric::RRTstar
          range: 0.0
          goal_bias: 0.05
          delay_collision_checking: 1
        BiTRRTkConfigDefault:
          type: geometric::BiTRRT
          range: 0.0
      ur_manipulator:
        planner_configs:
          - RRTConnectkConfigDefault
          - RRTstarkConfigDefault
          - BiTRRTkConfigDefault
        projection_evaluator: joints(shoulder_pan_joint,shoulder_lift_joint)
        longest_valid_segment_fraction: 0.01

    # ---- how MoveIt sends trajectories to the arm controller ---------------------------
    # (the gripper is driven directly by pick_place_executor)
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
    moveit_simple_controller_manager:
      controller_names:
        - joint_trajectory_controller
      joint_trajectory_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - shoulder_pan_joint
          - shoulder_lift_joint
          - elbow_joint
          - wrist_1_joint
          - wrist_2_joint
          - wrist_3_joint

    moveit_manage_controllers: false
    trajectory_execution:
      allowed_execution_duration_scaling: 2.0
      allowed_goal_duration_margin: 1.0
      allowed_start_tolerance: 0.05

    publish_planning_scene: true
    publish_geometry_updates: true
    publish_state_updates: true
    publish_transforms_updates: true
