controller_manager:
  ros__parameters:
    update_rate: 250
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

joint_trajectory_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 5.0
      shoulder_pan_joint: {goal: 0.05}
      shoulder_lift_joint: {goal: 0.05}
      elbow_joint: {goal: 0.05}
      wrist_1_joint: {goal: 0.05}
      wrist_2_joint: {goal: 0.05}
      wrist_3_joint: {goal: 0.05}

# Gripper: no goal tolerance on purpose. When a tray blocks the fingers the controller must NOT
# abort; the executor verifies the grasp from the finger joint states instead.
gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints: [finger_left_joint, finger_right_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
